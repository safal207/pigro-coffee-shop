name: Deploy Pigro to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke test
        run: |
          node tests/smoke.mjs
          node --check experience-addon.js
          node --test tests/experience.test.cjs
          node --check social-ui.js
          node --test tests/social-ui.test.cjs
      - name: Install browser test harness
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Chromium mobile and desktop regression
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v google-chrome-stable)" node tests/social-browser.cjs
      - name: Browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pigro-social-qa
          path: ${{ runner.temp }}/pigro-qa/
          if-no-files-found: ignore
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

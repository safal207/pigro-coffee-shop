name: QA · Pigro smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone HTML and JS
        run: |
          node tests/smoke.mjs
          node --check experience-addon.js
          node --test tests/experience.test.cjs
          node --check social-ui.js
          node --test tests/social-ui.test.cjs
